[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analogx-backend"
version = "0.1.0"
description = "Planetary Analog Discovery Engine for NASA Space Apps Challenge 2026 (Backend)"
readme = "README.md"
authors = [
    { name = "AnalogX Core Team", email = "team@analogx.space" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
gis = [
    "shapely>=2.0.0",
    "rasterio>=1.3.9",
    "geopandas>=0.14.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "flake8>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

